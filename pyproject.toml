[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zen-ai-meeting-agent-test"
version = "0.1.0"
description = "SQLite-backed LangGraph POC for the ZEN AI meeting agent design"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.0,<4",
]

[project.optional-dependencies]
dev = []

[project.scripts]
meeting-agent = "meeting_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

